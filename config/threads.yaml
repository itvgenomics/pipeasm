###############################################################################
# Pipeasm - Threads per rule (shared by local and SLURM modes)
#
# Pipeasm.sh appends this file to config/local_params.yaml or
# config/slurm_params.yaml to build the Snakemake profile, so the same thread
# counts are used in both modes. Edit THIS file, not profiles/*/config.yaml.
#
# Every rule runs with 1 thread unless it is listed here.
# To give a rule more threads, add or edit a line `<rule_name>: <threads>`.
#
# Local mode: a job never uses more threads than `Pipeasm.sh -t <N>`.
# SLURM mode: each job is submitted with --cpus-per-task = threads.
###############################################################################

set-threads:
  # Trimming and QC
  trimming_hic:                                    10
  qc_trim_hic:                                     8
  trimming_pacbio:                                 31
  trimming_ont:                                    31
  qc_trim_pacbio:                                  8
  qc_nanoplot_pacbio:                              8
  qc_nanoplot_ont:                                 8

  # K-mer profiling
  fastk:                                           31
  genescopeFK:                                     8
  smudgeplot:                                      31
  katgc:                                           31
  katcomp:                                         31

  # Assembly (Hifiasm)
  phased_assembly:                                 31
  ont_phased_assembly:                             31
  ont_solo_assembly:                               31
  solo_assembly:                                   31

  # Mitogenome (MitoHiFi)
  phased_run_mitohifi:                             31
  solo_run_mitohifi:                               31

  # Decontamination (FCS-adaptor and FCS-GX)
  phased_fcsadaptor_hap1:                          31
  phased_fcsadaptor_hap2:                          31
  phased_fcsgx:                                    31
  phased_fcsgx_clean_hap1:                         31
  phased_fcsgx_clean_hap2:                         31
  solo_fcsadaptor_hap1:                            31
  solo_fcsadaptor_hap2:                            31
  solo_fcsgx:                                      31
  solo_fcsgx_clean_hap1:                           31
  solo_fcsgx_clean_hap2:                           31

  # Assembly statistics (gfastats, Compleasm, MerquryFK, snail plots)
