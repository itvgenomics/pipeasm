  scaffolding_compleasm_hap2:                 {mem_mb: 200000}    # 200 GB
  scaffolding_compleasm_prim:                 {mem_mb: 200000}    # 200 GB
  scaffolding_compleasm_alt:                  {mem_mb: 200000}    # 200 GB
  scaffolding_run_snailplot_create_hap1:      {mem_mb: 8000}      # 8 GB
  scaffolding_run_snailplot_plot_hap1:        {mem_mb: 8000}      # 8 GB
  scaffolding_run_snailplot_create_hap2:      {mem_mb: 8000}      # 8 GB
  scaffolding_run_snailplot_plot_hap2:        {mem_mb: 8000}      # 8 GB
  scaffolding_run_snailplot_create_prim:      {mem_mb: 8000}      # 8 GB
  scaffolding_run_snailplot_plot_prim:        {mem_mb: 8000}      # 8 GB
  scaffolding_run_snailplot_create_alt:       {mem_mb: 8000}      # 8 GB
  scaffolding_run_snailplot_plot_alt:         {mem_mb: 8000}      # 8 GB
  scaffolding_gfastats_stats_hap1:            {mem_mb: 16000}     # 16 GB
  scaffolding_gfastats_stats_hap2:            {mem_mb: 16000}     # 16 GB
  scaffolding_gfastats_stats_prim:            {mem_mb: 16000}     # 16 GB
  scaffolding_gfastats_stats_alt:             {mem_mb: 16000}     # 16 GB
  scaffolding_merqury:                        {mem_mb: 200000}    # 200 GB
  scaffolding_merqury_prim:                   {mem_mb: 200000}    # 200 GB

  # Final report (rule all: parses the results into workflow/report)
  all:                                        {mem_mb: 8000}      # 8 GB
