###############################################################################
# Pipeasm - Snakemake profile for LOCAL execution (Pipeasm.sh -t <N>)
#
# This is a template. Pipeasm.sh joins this file with config/threads.yaml,
# replaces { WORKDIR }, and writes the result to profiles/local/config.yaml
# before every run. Edit THESE files, not the generated one.
#
# The total number of cores is set with `Pipeasm.sh -t <N>`. A job never uses
# more threads than that, even if a higher value is set in config/threads.yaml.
#
# Memory note: in local mode, Snakemake does not limit memory. Several heavy
# jobs (e.g., Hifiasm, MerquryFK, FCS-GX) may run at the same time, so make
# sure the machine has enough RAM (see "Hardware Requirements" in the README).
###############################################################################

# ── General settings ─────────────────────────────────────────────────────────
executor: local
use-singularity: true
singularity-args: "-B { WORKDIR }:/data -B { WORKDIR }/tmp:/tmp --pwd /data"   # container /tmp -> WORKDIR/tmp
latency-wait: 60                   # seconds to wait for output files on slow file systems
show-failed-logs: True             # print the log of a failed job
keep-going: True                   # keep running independent jobs when one fails
printshellcmds: True               # print the shell command of each job
rerun-incomplete: True             # re-run jobs whose output was left incomplete
max-status-checks-per-second: 20

