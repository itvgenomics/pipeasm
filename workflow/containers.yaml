###############################################################################
# Pipeasm - Container images used by the rules
#
#   <name>: <Docker image>:<tag>
#
# Each image is pulled once into `sif_dir` (config/config.yaml) as
# <name>_<tag>.sif, e.g. hic_mapping_1.1.sif. The rules refer to it with
# sif("<name>") (workflow/rules/common.smk), so the version is set only here.
#
# To update a tool, change its tag. The rules then use the new file, which
# Pipeasm.sh pulls on the next run; the old file stays in sif_dir for runs
# that still need it.
###############################################################################

hic_mapping: itvdsbioinfo/hic_mapping:1.1
yahs: itvdsbioinfo/yahs:1.2a.2
fastp: staphb/fastp:0.23.4
fastqc: staphb/fastqc:0.12.1
fkutils: itvdsbioinfo/fkutils:1.2
cutadapt: pipecraft/cutadapt:4.4
hifiasm: itvdsbioinfo/hifiasm:0.25.0
dorado: nanoporetech/dorado:shae36d1b49fe470a60e006afad90bedd2fc2774a89
nanoplot: staphb/nanoplot:1.41.6
blobtoolkit: genomehubs/blobtoolkit:4.3.5
compleasm: itvdsbioinfo/compleasm:0.2.8
mitohifi: ghcr.io/marcelauliano/mitohifi:master
gfastats: staphb/gfastats:1.3.6
